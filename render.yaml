services:
  - type: web
    name: indialegal-ai
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && node migrate.js
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: indialegal-ai-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: DATALAB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: indialegal-ai-db
    region: singapore
    plan: basic-256mb
