<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0b10" />
  <title>INDIALEGAL.AI</title>
  <link rel="stylesheet" href="/styles.css?v=4" />
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.7.5/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>INDIALEGAL<span class="ai">.AI</span></h1>
    </div>
    <p class="tagline">Upload a case. Speak to it.</p>
  </header>

  <main>
    <section id="upload-card" class="card">
      <h2>1. Upload a document</h2>
      <form id="upload-form">
        <input type="text" id="title" placeholder="Case title (optional)" />
        <label class="file-drop" for="file">
          <span id="file-label">Tap to choose PDF</span>
          <input type="file" id="file" name="pdf" accept="application/pdf" required />
        </label>
        <button id="upload-btn" type="submit">Upload &amp; Process</button>
        <p id="upload-status" class="status"></p>
      </form>
    </section>

    <section id="cases-card" class="card">
      <h2>2. Your cases</h2>
      <ul id="cases-list"></ul>
    </section>

    <section id="voice-card" class="card hidden">
      <h2 id="voice-card-title">3. Voice session</h2>
      <p id="voice-case"></p>
      <div id="facts-panel" class="facts-panel hidden"></div>
      <div id="research-panel" class="research-panel hidden">
        <h3>Active research</h3>
        <div id="research-list"></div>
      </div>
      <button id="start-voice" type="button">Start speaking</button>
      <button id="stop-voice" type="button" class="hidden">End session</button>
      <p id="voice-status" class="status"></p>
      <audio id="ai-audio" autoplay></audio>
      <div id="turn-log" class="turn-log"></div>
    </section>
  </main>

  <script src="/app.js?v=4"></script>
</body>
</html>
